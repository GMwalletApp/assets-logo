name: Process Token Override Issue

on:
  workflow_dispatch:
    inputs:
      issue_number:
        required: true
        type: string
      comment_id:
        required: false
        type: string

jobs:
  process-token-override:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Get Issue Body
        id: issue-body
        uses: actions/github-script@v8
        with:
          script: |
            const { data } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.inputs.issue_number }}
            });
            core.setOutput('body', data.body);

      - name: Parse Issue Body
        id: parse
        run: |
          echo "${{ steps.issue-body.outputs.body }}" | bun run scripts/parse-issue-body.ts token > $GITHUB_OUTPUT
          echo "result=$(cat $GITHUB_OUTPUT)" >> $GITHUB_OUTPUT

      - name: Validate Required Fields
        id: validate
        env:
          INPUT_TYPE: ${{ fromJson(steps.parse.outputs.result).input_type }}
          SYMBOL: ${{ fromJson(steps.parse.outputs.result).token_symbol }}
          ADDRESS: ${{ fromJson(steps.parse.outputs.result).token_address }}
          CHAINS: ${{ fromJson(steps.parse.outputs.result).chain_names }}
        run: |
          # Validate input type
          if [ "$INPUT_TYPE" = "Token Symbol" ]; then
            if [ -z "$SYMBOL" ]; then
              echo "Error: Symbol is required when using Token Symbol input type"
              exit 1
            fi
          else
            if [ -z "$ADDRESS" ]; then
              echo "Error: Address is required when using Token Address input type"
              exit 1
            fi
          fi

          # Validate chains
          if [ -z "$CHAINS" ]; then
            echo "Error: Chain name(s) is required"
            exit 1
          fi

          echo "input_type=$INPUT_TYPE" >> $GITHUB_ENV
          echo "symbol=$SYMBOL" >> $GITHUB_ENV
          echo "address=$ADDRESS" >> $GITHUB_ENV
          echo "chains=$CHAINS" >> $GITHUB_ENV

      - name: Download Issue Attachment
        env:
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun run scripts/download-issue-attachment.ts

      - name: Verify Downloaded Logo
        run: |
          if [ ! -f "temp_logo.png" ]; then
            echo "No image attachment found in issue"
            exit 1
          fi
          echo "Logo downloaded successfully"

      - name: Process Logo
        env:
          INPUT_TYPE: ${{ env.input_type }}
          SYMBOL: ${{ env.symbol }}
          ADDRESS: ${{ env.address }}
          CHAINS: ${{ env.chains }}
          DESCRIPTION: ${{ fromJson(steps.parse.outputs.result).reason || '' }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
        run: |
          bun run scripts/process-token-override.ts

      - name: Setup Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit Changes
        run: |
          git add overrides/
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "feat: Add token logo override

            Created from Issue #${{ github.event.inputs.issue_number }}"
          fi

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          title: "feat: Add token logo override from Issue #${{ github.event.inputs.issue_number }}"
          body: |
            ## Token Logo Override

            - **Input Type**: ${{ env.input_type }}
            - **Symbol**: ${{ env.symbol || 'N/A' }}
            - **Address**: ${{ env.address || 'N/A' }}
            - **Chains**: ${{ env.chains }}
            - **Description**: ${{ env.DESCRIPTION || 'N/A' }}

            Created from Issue #${{ github.event.inputs.issue_number }}

            ---

            _This PR was automatically generated by the override workflow._
          labels: "token-override, automated-pr"
          branch: "token-override/issue-${{ github.event.inputs.issue_number }}"
          delete-branch: true

      - name: Comment on Issue
        if: steps.cpr.outputs.pull-request-number != ''
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: ${{ github.event.inputs.issue_number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Token logo override has been processed! A pull request has been created: ' +
                    'https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/pull/' +
                    '${{ steps.cpr.outputs.pull-request-number }}'
            })

      - name: Clean up temp file
        if: always()
        run: |
          rm -f temp_logo.png
