name: Sync Logos and Notify

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual changes)'
        required: false
        default: 'false'
      chains:
        description: 'Chains to sync (comma-separated, leave empty for all)'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run sync
        id: sync
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            bun run scripts/sync-logos.ts --dry-run ${{ inputs.chains }}
          else
            bun run scripts/sync-logos.ts ${{ inputs.chains }}
          fi

      - name: Send email notification
        if: inputs.dry_run != 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: |
          if [ -n "$SMTP_HOST" ]; then
            echo "Sending email notification..."
            curl -X POST "https://api.sendgrid.com/v3/mail/send" \
              -H "Authorization: Bearer $SMTP_PASS" \
              -H "Content-Type: application/json" \
              -d '{
                "personalizations": [{"to": [{"email": "'$NOTIFICATION_EMAIL'"}]}],
                "from": {"email": "noreply@assets-logo.com"},
                "subject": "Logo Sync Update",
                "content": [{"type": "text/plain", "value": "Logos have been synced. Please review PR: https://github.com/your-org/assets-logo/pulls"}]
              }'
          else
            echo "SMTP not configured, skipping email notification"
          fi
