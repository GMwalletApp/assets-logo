name: Process Override Issue

on:
  issues:
    types: [opened, edited]

jobs:
  process-override:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'override') || contains(github.event.issue.labels.*.name, 'logo')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install
      
      - name: Parse Issue Form
        id: parse
        uses: peter-murray/issue-forms-body-parser@v2
        with:
          issue_id: ${{ github.event.issue.number }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Validate Required Fields
        id: validate
        env:
          CHAIN: ${{ steps.parse.outputs.chain }}
          ADDRESS: ${{ steps.parse.outputs.address }}
        run: |
          if [ -z "$CHAIN" ] || [ -z "$ADDRESS" ]; then
            echo "Missing required fields: chain or address"
            exit 1
          fi
          echo "chain=$CHAIN" >> $GITHUB_ENV
          echo "address=$ADDRESS" >> $GITHUB_ENV
      
      - name: Download Issue Attachment
        id: download
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun run scripts/download-issue-attachment.ts
      
      - name: Verify Downloaded Logo
        run: |
          if [ ! -f "temp_logo.png" ]; then
            echo "No image attachment found in issue"
            exit 1
          fi
          echo "Logo downloaded successfully"
      
      - name: Process Logo
        id: process
        env:
          CHAIN: ${{ env.chain }}
          ADDRESS: ${{ env.address }}
          DESCRIPTION: ${{ steps.parse.outputs.description || '' }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          bun run scripts/process-issue-override.ts
      
      - name: Setup Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Commit Changes
        run: |
          git add overrides/
          git add .overrides/
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "feat: Add logo override for ${{ env.chain }}/${{ env.address }}

            Created from Issue #${{ github.event.issue.number }}"
          fi
      
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v5
        with:
          title: "feat: Add logo override for ${{ env.chain }}/${{ env.address }}"
          body: |
            ## Logo Override
            
            - **Chain**: ${{ env.chain }}
            - **Address**: ${{ env.address }}
            - **Description**: ${{ steps.parse.outputs.description || 'N/A' }}
            
            Created from Issue #${{ github.event.issue.number }}
            
            ---

            _This PR was automatically generated by the override workflow._
          labels: "override, logo, automated-pr"
          branch: "override/${{ env.chain }}/${{ env.address }}"
          delete-branch: true
      
      - name: Comment on Issue
        if: steps.cpr.outputs.pull-request-number != ''
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Logo override has been processed! A pull request has been created: ' + 
                    'https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/pull/' +
                    '${{ steps.cpr.outputs.pull-request-number }}'
            })
      
      - name: Clean up temp file
        if: always()
        run: |
          rm -f temp_logo.png
