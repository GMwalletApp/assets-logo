name: Process Chain Override Issue

on:
  workflow_dispatch:
    inputs:
      issue_number:
        required: true
        type: string
      comment_id:
        required: false
        type: string

jobs:
  process-chain-override:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Parse Issue Form
        id: parse
        uses: peter-murray/issue-forms-body-parser@v2
        with:
          issue_id: ${{ github.event.inputs.issue_number }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Required Fields
        env:
          CHAIN_NAME: ${{ steps.parse.outputs.chain_name }}
        run: |
          if [ -z "$CHAIN_NAME" ]; then
            echo "Error: Chain name is required"
            exit 1
          fi
          echo "chain=$CHAIN_NAME" >> $GITHUB_ENV

      - name: Download Issue Attachment
        env:
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun run scripts/download-issue-attachment.ts

      - name: Verify Downloaded Logo
        run: |
          if [ ! -f "temp_logo.png" ]; then
            echo "No image attachment found in issue"
            exit 1
          fi
          echo "Logo downloaded successfully"

      - name: Process Logo
        env:
          CHAIN: ${{ env.chain }}
          DESCRIPTION: ${{ steps.parse.outputs.reason || '' }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
        run: |
          bun run scripts/process-chain-override.ts

      - name: Setup Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit Changes
        run: |
          git add overrides/
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "feat: Add chain logo override for ${{ env.chain }}

            Created from Issue #${{ github.event.inputs.issue_number }}"
          fi

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v5
        with:
          title: "feat: Add chain logo override for ${{ env.chain }} from Issue #${{ github.event.inputs.issue_number }}"
          body: |
            ## Chain Logo Override

            - **Chain**: ${{ env.chain }}
            - **Description**: ${{ steps.parse.outputs.reason || 'N/A' }}

            Created from Issue #${{ github.event.inputs.issue_number }}

            ---

            _This PR was automatically generated by the override workflow._
          labels: "chain-override, automated-pr"
          branch: "chain-override/${{ env.chain }}"
          delete-branch: true

      - name: Comment on Issue
        if: steps.cpr.outputs.pull-request-number != ''
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: ${{ github.event.inputs.issue_number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Chain logo override has been processed! A pull request has been created: ' +
                    'https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/pull/' +
                    '${{ steps.cpr.outputs.pull-request-number }}'
            })

      - name: Clean up temp file
        if: always()
        run: |
          rm -f temp_logo.png
