name: Process Chain Override Issue

on:
  workflow_dispatch:
    inputs:
      issue_number:
        required: true
        type: string
      comment_id:
        required: false
        type: string

jobs:
  process-chain-override:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Get Issue Body
        id: issue-body
        uses: actions/github-script@v8
        with:
          script: |
            const { data } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.inputs.issue_number }}
            });
            core.setOutput('body', data.body);

      - name: Parse Issue Body
        id: parse
        run: |
          cat << 'EOF' | bun run scripts/parse-issue-body.ts chain > parsed.json
          ${{ steps.issue-body.outputs.body }}
          EOF

      - name: Validate Required Fields
        env:
          CHAIN_NAME: $(cat parsed.json | bun run -e 'JSON.parse(stdin.read()).chain_name')
        run: |
          if [ -z "$CHAIN_NAME" ]; then
            echo "Error: Chain name is required"
            exit 1
          fi
          echo "chain=$CHAIN_NAME" >> $GITHUB_ENV

      - name: Download Image from URL
        run: |
          IMAGE_URL=$(cat parsed.json | bun run -e 'JSON.parse(stdin.read()).image || ""' | tr -d '\n\r')
          if [ -z "$IMAGE_URL" ]; then
            echo "Error: Image URL is required"
            exit 1
          fi
          echo "image_url=$IMAGE_URL" >> $GITHUB_ENV
          curl -L -o temp_logo.png "$IMAGE_URL"

      - name: Verify Downloaded Logo
        run: |
          if [ ! -f "temp_logo.png" ]; then
            echo "No image downloaded"
            exit 1
          fi
          echo "Logo downloaded successfully"

      - name: Process Logo
        env:
          CHAIN: ${{ env.chain }}
          IMAGE_URL: ${{ env.image_url }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
        run: |
          bun run scripts/process-chain-override.ts

      - name: Setup Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit Changes
        run: |
          git add overrides/
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "feat: Add chain logo override for ${{ env.chain }}

            Created from Issue #${{ github.event.inputs.issue_number }}"
          fi

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          title: "feat: Add chain logo override for ${{ env.chain }} from Issue #${{ github.event.inputs.issue_number }}"
          body: |
            ## Chain Logo Override

            - **Chain**: ${{ env.chain }}
            - **Image**: $(cat parsed.json | bun run -e 'JSON.parse(stdin.read()).image || "N/A"')

            Created from Issue #${{ github.event.inputs.issue_number }}

            ---

            _This PR was automatically generated by the override workflow._
          labels: "chain-override, automated-pr"
          branch: "chain-override/${{ env.chain }}"
          delete-branch: true

      - name: Comment on Issue
        if: steps.cpr.outputs.pull-request-number != ''
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: ${{ github.event.inputs.issue_number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Chain logo override has been processed! A pull request has been created: ' +
                    'https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/pull/' +
                    '${{ steps.cpr.outputs.pull-request-number }}'
            })

      - name: Clean up temp file
        if: always()
        run: |
          rm -f temp_logo.png
