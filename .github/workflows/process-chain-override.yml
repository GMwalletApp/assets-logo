name: Process Chain Override Issue

on:
  workflow_dispatch:
    inputs:
      issue_number:
        required: true
        type: string
      comment_id:
        required: false
        type: string

jobs:
  process-chain-override:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Get Issue Body
        id: issue-body
        uses: actions/github-script@v8
        with:
          script: |
            const { data } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.inputs.issue_number }}
            });
            core.setOutput('body', data.body);

      - name: Parse Issue Body
        id: parse
        run: |
          cat << 'EOF' | bun run scripts/parse-issue-body.ts chain --env > parsed.env
          ${{ steps.issue-body.outputs.body }}
          EOF
          source parsed.env
          echo "chain_name=$chain_name"
          echo "image=$image"

      - name: Validate Required Fields
        run: |
          source parsed.env
          if [ -z "$chain_name" ]; then
            echo "Error: Chain name is required"
            exit 1
          fi
          echo "chain=$chain_name" >> $GITHUB_ENV

      - name: Download Image from URL
        run: |
          source parsed.env
          if [ -z "$image" ]; then
            echo "Error: Image URL is required"
            exit 1
          fi
          echo "image_url=$image" >> $GITHUB_ENV
          curl -L -o temp_logo.png "$image"

      - name: Verify Downloaded Logo
        run: |
          if [ ! -f "temp_logo.png" ]; then
            echo "No image downloaded"
            exit 1
          fi
          echo "Logo downloaded successfully"

      - name: Process Logo
        run: |
          source parsed.env
          CHAIN="$chain_name" IMAGE_URL="$image" bun run scripts/process-chain-override.ts

      - name: Setup Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit Changes and Create PR
        run: |
          source parsed.env
          git add overrides/
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "feat: Add chain logo override for $chain_name

            Created from Issue #${{ github.event.inputs.issue_number }}"
          fi

          git push origin HEAD:chain-override/$chain_name

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          title: "feat: Add chain logo override for $chain_name from Issue #${{ github.event.inputs.issue_number }}"
          body: |
            ## Chain Logo Override

            - **Chain**: $chain_name
            - **Image**: $image

            Created from Issue #${{ github.event.inputs.issue_number }}

            ---

            _This PR was automatically generated by the override workflow._
          labels: "chain-override, automated-pr"
          branch: "chain-override/$chain_name"
          delete-branch: true

      - name: Comment on Issue
        if: steps.cpr.outputs.pull-request-number != ''
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: ${{ github.event.inputs.issue_number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Chain logo override has been processed! A pull request has been created: ' +
                    'https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/pull/' +
                    '${{ steps.cpr.outputs.pull-request-number }}'
            })

      - name: Clean up temp file
        if: always()
        run: |
          rm -f temp_logo.png parsed.env
