name: Check Override Updates

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      has_updates: ${{ steps.check.outputs.has_updates }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Check for override updates
        id: check
        run: |
          RESULT=$(bun run scripts/check-overrides.ts --json 2>&1 || echo '[]')
          echo "has_updates=$(echo $RESULT | jq 'length > 0')" >> $GITHUB_OUTPUT
          echo "updates_json=$(echo $RESULT | jq -c)" >> $GITHUB_OUTPUT

      - name: Create Issue if updates found
        if: steps.check.outputs.has_updates == 'true'
        uses: actions/github-script@v7
        env:
          UPDATES_JSON: ${{ steps.check.outputs.updates_json }}
        with:
          script: |
            const updates = JSON.parse(process.env.UPDATES_JSON);
            const dateStr = new Date().toISOString().split('T')[0];

            var body = '## Override Logo Updates\n\n';
            body += '⚠️ Detected updates to override logos:\n\n';
            body += '| Chain | Address | Old Hash | New Hash | Source |\n';
            body += '|-------|---------|----------|----------|--------|\n';

            for (var i = 0; i < updates.length; i++) {
              var u = updates[i];
              body += '| ' + u.chain + ' | ' + u.address + ' | ' + u.oldHash + ' | ' + u.newHash + ' | ' + u.source + ' |\n';
            }

            body += '\n**Suggested Actions:**\n';
            body += '- [ ] Confirm this is an expected change\n';
            body += '- [ ] If unexpected, please revert to the previous version\n';
            body += '- [ ] If confirmed, you may close this Issue\n\n';
            body += '---\n_Detected by automated script at ' + new Date().toISOString() + '_';

            const { data: issue } = await github.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Override Logo Updates - ' + dateStr,
              body: body,
              labels: ['logo-update', 'override']
            });

            console.log('Created Issue #' + issue.number + ': ' + issue.html_url);
