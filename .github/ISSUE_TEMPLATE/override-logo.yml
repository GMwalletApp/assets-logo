name: Override Logo
description: Submit a custom logo override for a token
title: "[Override] "
labels: ["override", "logo"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Override
      description: Select "Override" to submit a logo override
    validations:
      required: true
      
  - type: input
    id: chain
    attributes:
      label: Chain
      description: "Blockchain name (e.g., ethereum, binance-smart-chain, solana)"
      placeholder: "ethereum"
    validations:
      required: true
      
  - type: input
    id: address
    attributes:
      label: Token Address
      description: "Token contract address (use 'native' for native tokens)"
      placeholder: "0x1234..."
    validations:
      required: true
      
  - type: textarea
    id: description
    attributes:
      label: Description
      description: "Optional description for this override"
      
  - type: textarea
    id: comment
    attributes:
      label: Comment
      description: "Additional comments or notes"
      
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: "I confirm this logo is appropriate and follows the project's guidelines"
          required: true
