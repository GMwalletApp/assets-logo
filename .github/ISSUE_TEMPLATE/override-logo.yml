name: Logo Override
description: Submit a custom logo override for a token or chain
title: "[Override] "
labels: ["override", "logo"]
body:
  - type: dropdown
    id: input_type
    attributes:
      label: How to identify the token?
      options:
        - Token Symbol
        - Token Address
      description: Choose how to identify the token you want to override
    validations:
      required: true

  - type: input
    id: symbol
    attributes:
      label: Token Symbol
      placeholder: "USDT, USDC, ETH"
      description: Enter the token symbol (e.g., USDT, USDC)
    validations:
      required: false

  - type: input
    id: address
    attributes:
      label: Token Address
      placeholder: "0xdac17f958d2ee523a2206206994597c13d831ec7"
      description: Enter the token contract address
    validations:
      required: false

  - type: dropdown
    id: chain_scope
    attributes:
      label: Which chains to apply?
      options:
        - Single Chain
        - All Chains
        - Multiple Chains
      description: Select the scope of chains to apply this override
    validations:
      required: true

  - type: input
    id: chain
    attributes:
      label: Chain Name
      placeholder: "ethereum, binance-smart-chain, tron"
      description: Enter the single chain name
    validations:
      required: false

  - type: input
    id: chains
    attributes:
      label: Chain Names
      placeholder: "ethereum, binance, tron (comma-separated)"
      description: Enter multiple chain names separated by commas
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Optional description for this override

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: "I confirm this logo is appropriate and follows the project's guidelines"
          required: true
